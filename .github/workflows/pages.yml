name: Deploy to GitHub Pages

# Builds the Vite bundle and publishes dist/ to Pages. base: './' in
# vite.config.js makes the build relative, so it works unmodified whether Pages
# serves it from the root or a project subpath.
#
# Both branch names are listed because this repo grew a `main` after the fact:
# `claude/motherload-3d-game-zhj952` is the branch the work was done on and,
# for now, still the repository default. Listing both means the workflow keeps
# working whichever one is default, with no edit needed when that flips.
on:
  push:
    branches: [main, claude/motherload-3d-game-zhj952]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a queued deployment. Both branch names above are pushed together
# so they stay in sync, which means two runs enter this group at once — and with
# cancel-in-progress the second one killed the first. The one it killed was the
# run on the default branch, i.e. the only one allowed to publish, so a green
# tick appeared and the site silently kept serving the previous commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The github-pages environment only accepts deployments from the
    # repository's default branch. A run on any other branch is rejected by the
    # environment before the job starts: it fails in about one second, with no
    # steps and no log, which looks exactly like a broken workflow and is how an
    # afternoon gets lost. Check the condition here, where it can be explained,
    # rather than letting the environment reject it silently.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The other half of that check: say out loud why a good build did not publish.
  explain-skip:
    needs: build
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice title=Built, but not published::\
          The bundle built cleanly, but GitHub Pages only accepts deployments \
          from the repository's default branch \
          ('${{ github.event.repository.default_branch }}'). This run is on \
          '${{ github.ref_name }}', so the deploy was skipped rather than \
          failed. Either push to the default branch, or change the default \
          branch in Settings -> General."
